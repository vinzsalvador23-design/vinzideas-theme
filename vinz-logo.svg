<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Outer compass circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#173D36" stroke-width="2.5"/>

  <!-- Decorative inner circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#EBA36A" stroke-width="1" opacity="0.4"/>

  <!-- Cardinal directions -->
  <g font-family="Arial, sans-serif" font-weight="bold" font-size="12">
    <text x="100" y="28" text-anchor="middle" fill="#173D36" font-size="14">N</text>
    <text x="172" y="106" text-anchor="middle" fill="#173D36" font-size="14">E</text>
    <text x="100" y="176" text-anchor="middle" fill="#173D36" font-size="14">S</text>
    <text x="28" y="106" text-anchor="middle" fill="#173D36" font-size="14">W</text>
  </g>

  <!-- Cardinal point markers -->
  <g stroke="#173D36" stroke-width="1.5">
    <line x1="100" y1="18" x2="100" y2="25"/>
    <line x1="182" y1="100" x2="175" y2="100"/>
    <line x1="100" y1="182" x2="100" y2="175"/>
    <line x1="18" y1="100" x2="25" y2="100"/>
  </g>

  <!-- Diagonal markers -->
  <g stroke="#EBA36A" stroke-width="1" opacity="0.5">
    <line x1="135" y1="35" x2="140" y2="30"/>
    <line x1="165" y1="135" x2="170" y2="140"/>
    <line x1="65" y1="165" x2="60" y2="170"/>
    <line x1="35" y1="65" x2="30" y2="60"/>
  </g>

  <!-- V-shaped mountain (representing Vinz) -->
  <g>
    <!-- Main V mountain -->
    <polygon points="100,50 65,100 100,95 135,100" fill="#173D36"/>

    <!-- Orange accent on left slope of V -->
    <polygon points="100,50 65,100 83,75" fill="#EBA36A" opacity="0.85"/>

    <!-- Snow cap on peak of V -->
    <polygon points="100,50 92,62 108,62" fill="#EBA36A"/>
  </g>

  <!-- Compass needle -->
  <g>
    <!-- Upper needle (pointing North) -->
    <line x1="100" y1="100" x2="100" y2="60" stroke="#EBA36A" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Lower needle (pointing South) -->
    <line x1="100" y1="100" x2="100" y2="130" stroke="#EBA36A" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Center circle -->
  <circle cx="100" cy="100" r="6" fill="#173D36"/>
  <circle cx="100" cy="100" r="3" fill="#EBA36A"/>
</svg>